<svg width="400" height="225" viewBox="0 0 400 225" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><style>.bub circle{animation:bb 1.4s ease-in-out infinite alternate}.bub circle:nth-child(2n){animation-delay:.5s}@keyframes bb{to{transform:translateY(-6px)}}.rub{animation:rub .5s ease-in-out infinite alternate;transform-origin:200px 140px}@keyframes rub{from{transform:translateX(-10px) rotate(-4deg)}to{transform:translateX(10px) rotate(4deg)}}.fall{animation:fall 1s linear infinite}.fall:nth-child(2){animation-delay:.33s}.fall:nth-child(3){animation-delay:.66s}@keyframes fall{from{transform:translateY(-20px);opacity:1}to{transform:translateY(40px);opacity:0}}.flick{animation:fl .35s ease-in-out infinite alternate;transform-origin:center bottom;transform-box:fill-box}@keyframes fl{to{transform:scaleY(1.18) scaleX(.92)}}.stir{animation:st 1.2s linear infinite;transform-origin:200px 120px}@keyframes st{50%{transform:rotate(14deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="400" height="225" fill="#FFF6E4"/><g opacity=".55"><path d="M0 40h400" stroke="#EAD3AE" stroke-width="2"/><path d="M0 100h400" stroke="#EAD3AE" stroke-width="2"/><path d="M0 160h400" stroke="#EAD3AE" stroke-width="2"/><path d="M60 0v190" stroke="#EAD3AE" stroke-width="2"/><path d="M140 0v190" stroke="#EAD3AE" stroke-width="2"/><path d="M220 0v190" stroke="#EAD3AE" stroke-width="2"/><path d="M300 0v190" stroke="#EAD3AE" stroke-width="2"/><path d="M380 0v190" stroke="#EAD3AE" stroke-width="2"/></g><rect x="0" y="170" width="400" height="55" fill="#5B5470" stroke="#2B2140" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><rect x="110" y="160" width="180" height="14" rx="4" fill="#2B2140"/><g class="flick" fill="#F26B3A" stroke="#2B2140" stroke-width="1.8"><path d="M160 162c-8 0-12-6-10-14 2 4 6 5 6 1 0-6 6-8 6-14 6 6 8 14 6 20-1 5-4 7-8 7z"/></g><g class="flick" fill="#F5B82E" stroke="#2B2140" stroke-width="1.8"><path d="M200 162c-9 0-13-7-11-16 2 5 7 6 7 1 0-7 7-9 7-16 7 7 9 16 7 23-1 5-5 8-10 8z"/></g><g class="flick" fill="#F26B3A" stroke="#2B2140" stroke-width="1.8"><path d="M240 162c-8 0-12-6-10-14 2 4 6 5 6 1 0-6 6-8 6-14 6 6 8 14 6 20-1 5-4 7-8 7z"/></g><path d="M110 90h180v44a24 24 0 0 1-24 24H134a24 24 0 0 1-24-24z" fill="#5B5470" stroke="#2B2140" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M86 100h24M290 100h24" stroke="#2B2140" stroke-width="10" stroke-linecap="round"/><ellipse cx="200" cy="90" rx="92" ry="18" fill="#D98A2B" stroke="#2B2140" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="50" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="20" fill="#C24E22">sem mexer!</text><path d="M160 40l-20-10M240 40l20-10" stroke="#C24E22" stroke-width="3" stroke-linecap="round"/></svg>
