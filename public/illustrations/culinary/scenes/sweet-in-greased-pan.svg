<svg width="400" height="225" viewBox="0 0 400 225" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><style>.bub circle{animation:bb 1.4s ease-in-out infinite alternate}.bub circle:nth-child(2n){animation-delay:.5s}@keyframes bb{to{transform:translateY(-6px)}}.rub{animation:rub .5s ease-in-out infinite alternate;transform-origin:200px 140px}@keyframes rub{from{transform:translateX(-10px) rotate(-4deg)}to{transform:translateX(10px) rotate(4deg)}}.fall{animation:fall 1s linear infinite}.fall:nth-child(2){animation-delay:.33s}.fall:nth-child(3){animation-delay:.66s}@keyframes fall{from{transform:translateY(-20px);opacity:1}to{transform:translateY(40px);opacity:0}}.flick{animation:fl .35s ease-in-out infinite alternate;transform-origin:center bottom;transform-box:fill-box}@keyframes fl{to{transform:scaleY(1.18) scaleX(.92)}}.stir{animation:st 1.2s linear infinite;transform-origin:200px 120px}@keyframes st{50%{transform:rotate(14deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="400" height="225" fill="#FFF6E4"/><g opacity=".55"><path d="M0 40h400" stroke="#EAD3AE" stroke-width="2"/><path d="M0 100h400" stroke="#EAD3AE" stroke-width="2"/><path d="M0 160h400" stroke="#EAD3AE" stroke-width="2"/><path d="M60 0v190" stroke="#EAD3AE" stroke-width="2"/><path d="M140 0v190" stroke="#EAD3AE" stroke-width="2"/><path d="M220 0v190" stroke="#EAD3AE" stroke-width="2"/><path d="M300 0v190" stroke="#EAD3AE" stroke-width="2"/><path d="M380 0v190" stroke="#EAD3AE" stroke-width="2"/></g><rect x="0" y="170" width="400" height="55" fill="#D9C3A0" stroke="#2B2140" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M80 110h240l-16 60H96z" fill="#C9CFD6" stroke="#2B2140" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M92 110h216l-10 44H102z" fill="#E6EAEE" stroke="#2B2140" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><g stroke="#2B2140" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M120 128c0-12 26-14 28-2 1 8-28 10-28 2z" fill="#C8792E"/><path d="M168 124c2-12 30-10 28 2-2 8-30 6-28-2z" fill="#B8651E"/><path d="M220 130c2-10 30-8 28 2-2 7-30 6-28-2z" fill="#C8792E"/></g><path d="M150 60c0-12 10-14 10-26M200 56c0-12 10-14 10-26M250 60c0-12 10-14 10-26" stroke="#2B2140" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".35"/></svg>
