<svg width="400" height="225" viewBox="0 0 400 225" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><style>.bub circle{animation:bb 1.4s ease-in-out infinite alternate}.bub circle:nth-child(2n){animation-delay:.5s}@keyframes bb{to{transform:translateY(-6px)}}.rub{animation:rub .5s ease-in-out infinite alternate;transform-origin:200px 140px}@keyframes rub{from{transform:translateX(-10px) rotate(-4deg)}to{transform:translateX(10px) rotate(4deg)}}.fall{animation:fall 1s linear infinite}.fall:nth-child(2){animation-delay:.33s}.fall:nth-child(3){animation-delay:.66s}@keyframes fall{from{transform:translateY(-20px);opacity:1}to{transform:translateY(40px);opacity:0}}.flick{animation:fl .35s ease-in-out infinite alternate;transform-origin:center bottom;transform-box:fill-box}@keyframes fl{to{transform:scaleY(1.18) scaleX(.92)}}.stir{animation:st 1.2s linear infinite;transform-origin:200px 120px}@keyframes st{50%{transform:rotate(14deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="400" height="225" fill="#FFF6E4"/><g opacity=".55"><path d="M0 40h400" stroke="#EAD3AE" stroke-width="2"/><path d="M0 100h400" stroke="#EAD3AE" stroke-width="2"/><path d="M0 160h400" stroke="#EAD3AE" stroke-width="2"/><path d="M60 0v190" stroke="#EAD3AE" stroke-width="2"/><path d="M140 0v190" stroke="#EAD3AE" stroke-width="2"/><path d="M220 0v190" stroke="#EAD3AE" stroke-width="2"/><path d="M300 0v190" stroke="#EAD3AE" stroke-width="2"/><path d="M380 0v190" stroke="#EAD3AE" stroke-width="2"/></g><rect x="0" y="180" width="400" height="45" fill="#D9C3A0" stroke="#2B2140" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M290 70h40v110h-40z" fill="#D3F2EC" stroke="#2B2140" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><rect x="298" y="48" width="24" height="24" fill="#14A392" stroke="#2B2140" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><path d="M322 56h20" stroke="#2B2140" stroke-width="6" stroke-linecap="round"/><g fill="#BFE6F5" stroke="#2B2140" stroke-width="1.4"><ellipse class="fall" cx="336" cy="74" rx="4" ry="6"/></g><g class="rub"><g class=""><path transform="translate(40 0)" d="M130 178C104 170 92 146 96 120c2-14 18-16 22-4l6 16V64c0-12 18-12 18 0v-8c0-12 18-12 18 0v4c0-12 18-12 18 0v12c0-12 18-12 18 0v68c0 26-20 42-46 40z" fill="#E8B58E" stroke="#2B2140" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></g></g><text x="304" y="130" font-family="Figtree, sans-serif" font-weight="800" font-size="14" fill="#0C7A6D">70%</text></svg>
